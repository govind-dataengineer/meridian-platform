[project]
name = "meridian"
version = "0.1.0"
description = "Meridian Retail platform: ingestion, backend, and (later) the support agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42",        # needed by PyMySQL for MySQL 8 auth
    "pydantic-settings>=2.4",
    "boto3>=1.35",
    "typer>=0.12",
    "structlog>=24",
]

[project.scripts]
meridian = "meridian.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[s3]>=1.43.126",
    "moto[s3]>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["meridian"]

[[tool.mypy.overrides]]
module = ["pymysql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: needs the docker compose stack (MySQL + Floci) running"]
