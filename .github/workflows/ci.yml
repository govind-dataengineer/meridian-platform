name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=meridian --cov-report=term-missing

  integration:
    name: Integration (MySQL + Floci)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: cp .env.example .env
      # Same compose file as your laptop, so "works locally" == "works in CI".
      - run: docker compose up -d mysql floci
      - run: uv sync --frozen
      - run: uv run python scripts/wait_for_stack.py
      - run: uv run pytest -m integration
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color

  image:
    name: Build app image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: meridian:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
